<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Public Sans', system-ui, sans-serif; }
    a { color: #b95c38; } a:hover { color: #96452a; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f6f1e6; color: #22382b; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 26px 20px 14px 20px; display: flex; flex-direction: column; gap: 8px; border-bottom: 2px solid #22382b;">
    <div style="font-family: 'DM Serif Display', Georgia, serif; font-size: 30px; line-height: 1.05;">Tuesday Night Open&nbsp;Play</div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #6f6a5e;">3 courts &middot; cap 6 games</div>
      <div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #b95c38; font-weight: 600;">In play</div>
    </div>
  </div>

  <div style="display: flex; border-bottom: 1px solid #d9d2c2; background: #fffdf7;">
    <div style="flex: 1 1 0; text-align: center; padding: 15px 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #22382b; border-bottom: 2px solid #b95c38;">Playing</div>
    <div style="flex: 1 1 0; text-align: center; padding: 15px 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; color: #6f6a5e;">Queue</div>
    <div style="flex: 1 1 0; text-align: center; padding: 15px 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; color: #6f6a5e;">Leaders</div>
    <div style="flex: 1 1 0; text-align: center; padding: 15px 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; color: #6f6a5e;">History</div>
  </div>

  <div style="flex: 1 1 auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px;">

    <div style="background: #fffdf7; border: 1px solid #d9d2c2; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 0 #d9d2c2;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #eee7d8; padding-bottom: 8px;">
        <div style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #b95c38;">Court One</div>
        <div style="font-size: 12px; color: #6f6a5e;">No. 7 &middot; 7:42 pm</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex: 1 1 0; font-family: 'DM Serif Display', Georgia, serif; font-size: 20px; line-height: 1.3;">Sarah<br>Mike</div>
        <div style="font-size: 12px; letter-spacing: 0.1em; color: #6f6a5e; font-style: italic; font-family: Georgia, serif;">versus</div>
        <div style="flex: 1 1 0; font-family: 'DM Serif Display', Georgia, serif; font-size: 20px; line-height: 1.3; text-align: right;">Ana<br>Luis</div>
      </div>
    </div>

    <div style="background: #fffdf7; border: 1px solid #d9d2c2; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 0 #d9d2c2;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #eee7d8; padding-bottom: 8px;">
        <div style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #b95c38;">Court Two</div>
        <div style="font-size: 12px; color: #6f6a5e;">No. 8 &middot; 7:45 pm</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex: 1 1 0; font-family: 'DM Serif Display', Georgia, serif; font-size: 20px; line-height: 1.3;">Jen<br>Marc</div>
        <div style="font-size: 12px; letter-spacing: 0.1em; color: #6f6a5e; font-style: italic; font-family: Georgia, serif;">versus</div>
        <div style="flex: 1 1 0; font-family: 'DM Serif Display', Georgia, serif; font-size: 20px; line-height: 1.3; text-align: right;">Kim<br>Dave</div>
      </div>
    </div>

    <div style="border: 1px dashed #c9c0aa; border-radius: 6px; padding: 16px; display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #a59d8c;">Court Three</div>
      <div style="font-size: 12px; color: #a59d8c; font-style: italic; font-family: Georgia, serif;">open</div>
    </div>

  </div>

  <div style="padding: 14px; text-align: center; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #a59d8c;">Scores update automatically</div>
</div>
</x-dc>
</body>
</html>
