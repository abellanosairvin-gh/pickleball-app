<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Public Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #b95c38; } a:hover { color: #96452a; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f6f1e6; color: #22382b; display: flex; flex-direction: column; overflow: hidden;">
  <div style="padding: 24px 20px 12px 20px; display: flex; flex-direction: column; gap: 8px; border-bottom: 2px solid #22382b;">
    <div style="font-family: 'DM Serif Display', Georgia, serif; font-size: 30px; line-height: 1.05;">Tuesday Night Open&nbsp;Play</div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #6f6a5e;">3 courts &middot; cap 6 games</div>
      <div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #b95c38; font-weight: 600;">In play</div>
    </div>
  </div>
  <div style="display: flex; border-bottom: 1px solid #d9d2c2; background: #fffdf7;"><div style="flex: 1 1 0; text-align: center; padding: 14px 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; color: #6f6a5e; border-bottom: 2px solid transparent;">Playing</div><div style="flex: 1 1 0; text-align: center; padding: 14px 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #22382b; border-bottom: 2px solid #b95c38;">Queue</div><div style="flex: 1 1 0; text-align: center; padding: 14px 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; color: #6f6a5e; border-bottom: 2px solid transparent;">Results</div></div>
  <div style="flex: 1 1 auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="background: #f9e9df; border: 1px solid #d89a7c; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 0 #d9d2c2;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid #d89a7c; padding-bottom: 8px;">
        <div style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #b95c38;">Up next</div>
        <div style="white-space: nowrap; font-size: 12px; color: #96452a;">No. 9 &middot; first free court</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex: 1 1 0; min-width: 0; font-family: 'DM Serif Display', Georgia, serif; font-size: 24px; line-height: 1.25;">Sarah<br>Mike</div>
        <div style="font-family: Georgia, serif; font-style: italic; font-size: 12px; letter-spacing: 0.05em; color: #96452a;">versus</div>
        <div style="flex: 1 1 0; min-width: 0; text-align: right; font-family: 'DM Serif Display', Georgia, serif; font-size: 24px; line-height: 1.25;">Ana<br>Luis</div>
      </div>
    </div>
    <div style="margin-top: 6px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #6f6a5e;">Then</div>
    <div style="background: #fffdf7; border: 1px solid #d9d2c2; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 0 #d9d2c2;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #eee7d8;">
        <div style="width: 22px; flex: 0 0 auto; font-family: 'DM Serif Display', Georgia, serif; font-size: 18px; color: #a59d8c;">2</div>
        <div style="flex: 1 1 0; min-width: 0; font-size: 14px; line-height: 1.35;">Jen &amp; Marc <span style="font-family: Georgia, serif; font-style: italic; color: #a59d8c;">vs</span> Kim &amp; Dave</div>
        
        <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #a59d8c; white-space: nowrap;">No. 10</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #eee7d8;">
        <div style="width: 22px; flex: 0 0 auto; font-family: 'DM Serif Display', Georgia, serif; font-size: 18px; color: #a59d8c;">3</div>
        <div style="flex: 1 1 0; min-width: 0; font-size: 14px; line-height: 1.35;">Priya &amp; Tom <span style="font-family: Georgia, serif; font-style: italic; color: #a59d8c;">vs</span> Nate &amp; Rosa</div>
        <div style="width: fit-content; white-space: nowrap; border: 1px solid; border-radius: 999px; padding: 2px 8px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; border-color: #d89a7c; background: #f9e9df; color: #96452a; font-weight: 700; ">Battle for 3rd</div>
        <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #a59d8c; white-space: nowrap;">No. 11</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #eee7d8;">
        <div style="width: 22px; flex: 0 0 auto; font-family: 'DM Serif Display', Georgia, serif; font-size: 18px; color: #a59d8c;">4</div>
        <div style="flex: 1 1 0; min-width: 0; font-size: 14px; line-height: 1.35;">Omar &amp; Bea <span style="font-family: Georgia, serif; font-style: italic; color: #a59d8c;">vs</span> Chloe &amp; Sam</div>
        
        <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #a59d8c; white-space: nowrap;">No. 12</div>
      </div>
    </div>
  </div>
  <div style="padding: 14px; text-align: center; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #a59d8c;">Scores update automatically</div>
</div>
</x-dc>
</body>
</html>
