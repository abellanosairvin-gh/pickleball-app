<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, system-ui, sans-serif; }
    a { color: #047857; } a:hover { color: #065f46; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f7f7f6; color: #26292e; display: flex; flex-direction: column; overflow: hidden;">

  <div style="background: #047857; color: #ffffff; padding: 22px 20px 18px 20px; display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-weight: 800; font-size: 22px; letter-spacing: -0.01em;">Tuesday Night Open Play</div>
      <div style="background: rgba(255,255,255,0.16); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 600;">Live</div>
    </div>
    <div style="font-size: 13px; color: rgba(255,255,255,0.75);">3 courts &middot; cap 6 games</div>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e4e1;">
    <div style="flex: 1 1 0; text-align: center; padding: 11px 0; font-size: 13px; font-weight: 700; color: #ffffff; background: #047857; border-radius: 8px;">Playing</div>
    <div style="flex: 1 1 0; text-align: center; padding: 11px 0; font-size: 13px; font-weight: 600; color: #5c6167; background: #f1f1ef; border-radius: 8px;">Queue</div>
    <div style="flex: 1 1 0; text-align: center; padding: 11px 0; font-size: 13px; font-weight: 600; color: #5c6167; background: #f1f1ef; border-radius: 8px;">Leaders</div>
    <div style="flex: 1 1 0; text-align: center; padding: 11px 0; font-size: 13px; font-weight: 600; color: #5c6167; background: #f1f1ef; border-radius: 8px;">History</div>
  </div>

  <div style="flex: 1 1 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;">

    <div style="background: #ffffff; border: 1px solid #e4e4e1; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #eeeeec;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="background: #047857; color: #ffffff; font-weight: 800; font-size: 13px; border-radius: 6px; padding: 4px 9px;">1</div>
          <div style="font-weight: 700; font-size: 14px;">Court 1</div>
        </div>
        <div style="font-size: 12px; color: #83888e; font-variant-numeric: tabular-nums;">#7 &middot; 7:42 PM</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px;">
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-weight: 600; font-size: 16px;">Sarah</div>
          <div style="font-weight: 600; font-size: 16px;">Mike</div>
        </div>
        <div style="font-size: 12px; font-weight: 700; color: #b6babe;">vs</div>
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px; text-align: right;">
          <div style="font-weight: 600; font-size: 16px;">Ana</div>
          <div style="font-weight: 600; font-size: 16px;">Luis</div>
        </div>
      </div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e4e4e1; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #eeeeec;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="background: #047857; color: #ffffff; font-weight: 800; font-size: 13px; border-radius: 6px; padding: 4px 9px;">2</div>
          <div style="font-weight: 700; font-size: 14px;">Court 2</div>
        </div>
        <div style="font-size: 12px; color: #83888e; font-variant-numeric: tabular-nums;">#8 &middot; 7:45 PM</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px;">
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-weight: 600; font-size: 16px;">Jen</div>
          <div style="font-weight: 600; font-size: 16px;">Marc</div>
        </div>
        <div style="font-size: 12px; font-weight: 700; color: #b6babe;">vs</div>
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px; text-align: right;">
          <div style="font-weight: 600; font-size: 16px;">Kim</div>
          <div style="font-weight: 600; font-size: 16px;">Dave</div>
        </div>
      </div>
    </div>

    <div style="border: 1px dashed #cfcfcb; border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 8px;">
      <div style="background: #e8e8e5; color: #83888e; font-weight: 800; font-size: 13px; border-radius: 6px; padding: 4px 9px;">3</div>
      <div style="font-weight: 600; font-size: 14px; color: #83888e;">Court 3 — open</div>
    </div>

  </div>

  <div style="padding: 14px; text-align: center; font-size: 12px; color: #a2a6aa;">Scores update automatically</div>
</div>
</x-dc>
</body>
</html>
