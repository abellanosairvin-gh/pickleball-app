<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Barlow, system-ui, sans-serif; }
    a { color: #d4e128; } a:hover { color: #e8f06a; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #131210; color: #f4f1ea; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 24px 20px 16px 20px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase;">Tuesday Night Open Play</div>
      <div style="display: flex; align-items: center; gap: 6px; background: #1d1b18; border: 1px solid #2a2723; border-radius: 999px; padding: 5px 10px;">
        <span style="width: 7px; height: 7px; border-radius: 999px; background: #d4e128;"></span>
        <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.12em; color: #d4e128;">LIVE</span>
      </div>
    </div>
    <div style="font-size: 13px; color: #a39d92;">3 courts &middot; cap 6 games &middot; updates every 10s</div>
  </div>

  <div style="display: flex; border-bottom: 1px solid #2a2723; padding: 0 8px;">
    <div style="flex: 1 1 0; text-align: center; padding: 14px 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; color: #d4e128; border-bottom: 3px solid #d4e128;">Playing</div>
    <div style="flex: 1 1 0; text-align: center; padding: 14px 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; color: #a39d92; border-bottom: 3px solid transparent;">Queue</div>
    <div style="flex: 1 1 0; text-align: center; padding: 14px 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; color: #a39d92; border-bottom: 3px solid transparent;">Leaders</div>
    <div style="flex: 1 1 0; text-align: center; padding: 14px 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; color: #a39d92; border-bottom: 3px solid transparent;">History</div>
  </div>

  <div style="flex: 1 1 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;">

    <div style="background: #1d1b18; border: 1px solid #2a2723; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.06em; color: #d4e128;">COURT 1</div>
        <div style="font-size: 12px; color: #a39d92;">Game #7 &middot; 7:42 PM</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-weight: 600; font-size: 18px;">Sarah</div>
          <div style="font-weight: 600; font-size: 18px;">Mike</div>
        </div>
        <div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 18px; color: #6e6a61; letter-spacing: 0.08em;">VS</div>
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px; text-align: right;">
          <div style="font-weight: 600; font-size: 18px;">Ana</div>
          <div style="font-weight: 600; font-size: 18px;">Luis</div>
        </div>
      </div>
    </div>

    <div style="background: #1d1b18; border: 1px solid #2a2723; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.06em; color: #d4e128;">COURT 2</div>
        <div style="font-size: 12px; color: #a39d92;">Game #8 &middot; 7:45 PM</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-weight: 600; font-size: 18px;">Jen</div>
          <div style="font-weight: 600; font-size: 18px;">Marc</div>
        </div>
        <div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 18px; color: #6e6a61; letter-spacing: 0.08em;">VS</div>
        <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px; text-align: right;">
          <div style="font-weight: 600; font-size: 18px;">Kim</div>
          <div style="font-weight: 600; font-size: 18px;">Dave</div>
        </div>
      </div>
    </div>

    <div style="border: 1px dashed #3a362f; border-radius: 14px; padding: 18px 16px; display: flex; align-items: center; justify-content: space-between;">
      <div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.06em; color: #6e6a61;">COURT 3</div>
      <div style="font-size: 13px; color: #6e6a61;">open</div>
    </div>

  </div>

  <div style="padding: 14px; text-align: center; font-size: 12px; color: #6e6a61;">Scores update automatically</div>
</div>
</x-dc>
</body>
</html>
